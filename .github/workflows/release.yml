name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Restore signing keystore (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$HOME/.wow-mobile-secrets"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.wow-mobile-secrets/wowmobile.keystore"
          cat > "$HOME/.wow-mobile-secrets/keystore.properties" <<EOF
          storeFile=$HOME/.wow-mobile-secrets/wowmobile.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=wowmobile
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release*.apk \
             "wow-mobile-${GITHUB_REF_NAME}.apk"

      - name: Attach APK to GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: wow-mobile-*.apk
          generate_release_notes: true

      - name: Upload artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: wow-mobile-apk
          path: wow-mobile-*.apk
