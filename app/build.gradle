apply plugin: 'com.android.application'

android {
    compileSdk 34

    defaultConfig {
        applicationId 'com.winlator'
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 1
        versionName "0.1.0"
    }

    // Release signing: reads WOW_KEYSTORE_PROPS env var or ~/.wow-mobile-secrets/keystore.properties.
    // When neither exists (e.g. CI without secrets) the release build is simply unsigned.
    def keystorePropsFile = System.getenv('WOW_KEYSTORE_PROPS') != null ?
        new File(System.getenv('WOW_KEYSTORE_PROPS')) :
        new File(System.getProperty('user.home'), '.wow-mobile-secrets/keystore.properties')

    if (keystorePropsFile.exists()) {
        def keystoreProps = new Properties()
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
        signingConfigs {
            release {
                storeFile new File(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters 'arm64-v8a'
            }

            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    // CMake declares the jniLibs prebuilts as IMPORTED SHARED targets, so AGP sees
    // each .so twice (jniLibs merge + cxx output). Both copies are identical files.
    packagingOptions {
        jniLibs {
            pickFirsts.add('lib/arm64-v8a/*.so')
        }
    }

    ndkVersion '24.0.8215888'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
}
